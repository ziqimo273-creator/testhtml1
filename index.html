<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏内容管理系统</title>
<style>
:root{--blue:#246bfe;--ink:#1d2b40;--muted:#73839b;--line:#e5ebf3;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:9px 15px;background:var(--blue);color:white}.top{height:58px;background:#1d293a;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-size:18px;font-weight:700}.layout{display:flex;min-height:calc(100vh - 58px)}aside{width:175px;background:#1b293b;padding:14px 8px;color:#c7d2e1}.nav{padding:12px;border-radius:7px;margin-bottom:5px}.nav.active{background:#246bfe;color:white}.main{flex:1;padding:22px;min-width:0}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 8px #172b4408}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.heading h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:12px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid #dbe3ee;border-radius:6px;padding:10px;background:white;color:var(--ink);width:100%;outline-color:var(--blue)}.filters input{width:240px}.filters select{width:130px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf1f6}th{background:#f8fafd;font-size:12px;color:#61718a}tbody tr:hover{background:#fafcff}.game{display:flex;align-items:center;gap:10px}.cover{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#e8effa}.badge{display:inline-block;padding:4px 9px;border-radius:5px;background:#dff8eb;color:#09945b;font-size:12px}.badge.draft{background:#fff0dc;color:#ce741b}.tag{display:inline-block;background:#edf3fc;color:#47617f;padding:3px 6px;border-radius:4px;margin-right:3px;font-size:11px}.link{background:none;color:var(--blue);padding:4px 6px}.footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;color:var(--muted);font-size:12px}.overlay{display:none;position:fixed;inset:0;background:#14223870;justify-content:flex-end}.overlay.open{display:flex}.drawer{width:min(620px,100%);height:100%;overflow:auto;background:#fff;padding:22px;box-shadow:-8px 0 30px #15284420}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer h2{margin:0}.section{border:1px solid var(--line);border-radius:8px;padding:15px;margin-bottom:12px}.section h3{font-size:14px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;font-size:12px;margin-bottom:6px;color:#586a82}.field textarea{height:90px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;padding:8px 0 18px}.secondary{background:white;border:1px solid #dbe3ee;color:#52637a}.danger{color:#e14b4b}.empty{padding:35px;text-align:center;color:var(--muted);display:none}@media(max-width:850px){aside{width:62px}aside .nav{font-size:0;text-align:center}aside .nav:first-letter{font-size:18px}.main{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.heading h1{font-size:18px}.filters input{width:100%}.panel{padding:12px}}
</style></head>
<body>
<header class="top"><div class="brand">🎮 游戏内容管理系统</div><div>🔎 <input id="globalSearch" placeholder="搜索游戏名称…" style="padding:7px;border:0;border-radius:5px">　👤 admin⌄</div></header>
<div class="layout"><aside><div class="nav active">🎮　游戏管理</div><div class="nav">📁　分类管理</div><div class="nav">◆　标签管理</div><div class="nav">☁　批量导入</div><div class="nav">▥　数据统计</div><div class="nav">⚙　系统设置</div></aside>
<main class="main"><section class="panel"><div class="heading"><div><h1>游戏管理</h1><div class="muted">管理游戏信息，支持新增、编辑、删除和发布</div></div><button onclick="openForm()">＋ 新增游戏</button></div>
<div class="filters"><input id="search" placeholder="⌕ 请输入游戏名称、英文名或别名"><select id="category"><option value="">全部分类</option><option>角色扮演</option><option>射击</option><option>MOBA</option><option>沙盒</option><option>竞速</option><option>休闲</option><option>策略</option></select><select id="platform"><option value="">全部平台</option><option>PC</option><option>安卓</option><option>iOS</option><option>网页</option></select><select id="status"><option value="">全部状态</option><option value="已发布">已发布</option><option value="草稿">草稿</option></select><button onclick="render()">搜索</button><button class="secondary" onclick="resetFilters()">重置</button></div>
<div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="all"></th><th>游戏信息</th><th>英文名</th><th>分类</th><th>平台</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">暂无游戏数据，点击“新增游戏”开始录入。</div></div><div class="footer"><span id="count">共 0 条数据</span><span>每页 10 条　　1</span></div></section></main></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeForm()"><div class="drawer"><div class="drawer-head"><h2 id="formTitle">新增游戏</h2><button class="secondary" onclick="closeForm()">✕</button></div><form id="gameForm"><input type="hidden" id="editId"><div class="section"><h3>基本信息</h3><div class="grid"><div class="field"><label>游戏名称 *</label><input id="name" required placeholder="请输入游戏名称"></div><div class="field"><label>英文名称</label><input id="english" placeholder="English name"></div><div class="field"><label>游戏别名</label><input id="alias" placeholder="多个别名用逗号隔开"></div><div class="field"><label>游戏分类 *</label><select id="cat" required><option value="">请选择分类</option><option>角色扮演</option><option>射击</option><option>MOBA</option><option>沙盒</option><option>竞速</option><option>休闲</option><option>策略</option></select></div><div class="field wide"><label>游戏平台</label><div id="platformChecks"><label><input type="checkbox" value="PC"> PC　</label><label><input type="checkbox" value="安卓"> 安卓　</label><label><input type="checkbox" value="iOS"> iOS　</label><label><input type="checkbox" value="网页"> 网页</label></div></div><div class="field"><label>发布状态</label><select id="state"><option>草稿</option><option>已发布</option></select></div><div class="field"><label>封面图片 URL</label><input id="cover" placeholder="https://…"></div><div class="field wide"><label>游戏简介</label><textarea id="intro" maxlength="200" placeholder="请输入游戏简介，最多 200 字"></textarea></div><div class="field wide"><label>游戏详情</label><textarea id="detail" placeholder="请输入游戏详细介绍"></textarea></div></div></div><div class="section"><h3>SEO 信息与下载</h3><div class="grid"><div class="field wide"><label>SEO 标题</label><input id="seoTitle" maxlength="60" placeholder="搜索引擎标题"></div><div class="field wide"><label>SEO 描述</label><textarea id="seoDesc" maxlength="160" placeholder="搜索引擎描述"></textarea></div><div class="field"><label>标签</label><input id="tags" placeholder="冒险,多人,开放世界"></div><div class="field"><label>下载地址</label><input id="download" placeholder="https://…"></div></div></div><div class="actions"><button type="button" class="secondary" onclick="closeForm()">取消</button><button type="submit">保存游戏</button></div></form></div></div>
<script>
const key='game-cms-data-v1';let games=JSON.parse(localStorage.getItem(key)||'null')||[
{id:1,name:'原神',english:'Genshin Impact',alias:'',cat:'角色扮演',platforms:['PC','安卓','iOS'],state:'已发布',updated:'2025-05-10 14:32',cover:'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=100',intro:'开放世界冒险游戏',detail:'',seoTitle:'原神',seoDesc:'',tags:'开放世界',download:''},
{id:2,name:'和平精英',english:'Game for Peace',alias:'吃鸡',cat:'射击',platforms:['安卓','iOS'],state:'已发布',updated:'2025-05-09 10:21',cover:'',intro:'战术竞技手游',detail:'',seoTitle:'和平精英',seoDesc:'',tags:'射击',download:''},
{id:3,name:'王者荣耀',english:'Honor of Kings',alias:'',cat:'MOBA',platforms:['安卓','iOS'],state:'已发布',updated:'2025-05-08 16:45',cover:'',intro:'多人在线战术竞技游戏',detail:'',seoTitle:'王者荣耀',seoDesc:'',tags:'MOBA',download:''},
{id:4,name:'我的世界',english:'Minecraft',alias:'MC',cat:'沙盒',platforms:['PC','安卓','iOS'],state:'草稿',updated:'2025-05-07 11:20',cover:'',intro:'自由创造与探索',detail:'',seoTitle:'我的世界',seoDesc:'',tags:'沙盒',download:''}];let nextId=Math.max(0,...games.map(g=>g.id))+1;
function persist(){localStorage.setItem(key,JSON.stringify(games))}
function render(){const q=(document.getElementById('search').value||document.getElementById('globalSearch').value).trim().toLowerCase(),cat=document.getElementById('category').value,plat=document.getElementById('platform').value,state=document.getElementById('status').value;const list=games.filter(g=>(!q||[g.name,g.english,g.alias].join(' ').toLowerCase().includes(q))&&(!cat||g.cat===cat)&&(!plat||g.platforms.includes(plat))&&(!state||g.state===state));document.getElementById('rows').innerHTML=list.map(g=>'<tr><td><input type="checkbox" class="pick" value="'+g.id+'"></td><td><div class="game"><img class="cover" src="'+(g.cover||'')+'" onerror="this.style.display=\'none\'"><strong>'+esc(g.name)+'</strong></div></td><td>'+esc(g.english||'—')+'</td><td>'+esc(g.cat)+'</td><td>'+g.platforms.map(p=>'<span class="tag">'+esc(p)+'</span>').join('')+'</td><td><span class="badge '+(g.state==='草稿'?'draft':'')+'">'+g.state+'</span></td><td>'+g.updated+'</td><td><button class="link" onclick="editGame('+g.id+')">编辑</button><button class="link danger" onclick="removeGame('+g.id+')">删除</button><button class="link" onclick="toggleState('+g.id+')">'+(g.state==='草稿'?'发布':'转草稿')+'</button></td></tr>').join('');document.getElementById('empty').style.display=list.length?'none':'block';document.getElementById('count').textContent='共 '+list.length+' 条数据';}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(){document.getElementById('gameForm').reset();document.getElementById('editId').value='';document.getElementById('formTitle').textContent='新增游戏';document.getElementById('overlay').classList.add('open')}
function closeForm(){document.getElementById('overlay').classList.remove('open')}
function editGame(id){const g=games.find(x=>x.id===id);openForm();document.getElementById('formTitle').textContent='编辑游戏';['name','english','alias','cat','state','cover','intro','detail','seoTitle','seoDesc','tags','download'].forEach(k=>{const map={cat:'cat',state:'state'};document.getElementById(k).value=g[{name:'name',english:'english',alias:'alias',cat:'cat',state:'state',cover:'cover',intro:'intro',detail:'detail',seoTitle:'seoTitle',seoDesc:'seoDesc',tags:'tags',download:'download'}[k]]||''});document.getElementById('editId').value=id;document.querySelectorAll('#platformChecks input').forEach(c=>c.checked=g.platforms.includes(c.value))}
document.getElementById('gameForm').addEventListener('submit',e=>{e.preventDefault();const id=Number(document.getElementById('editId').value);const g={id:id||nextId++,name:val('name'),english:val('english'),alias:val('alias'),cat:val('cat'),state:val('state'),cover:val('cover'),intro:val('intro'),detail:val('detail'),seoTitle:val('seoTitle'),seoDesc:val('seoDesc'),tags:val('tags'),download:val('download'),platforms:[...document.querySelectorAll('#platformChecks input:checked')].map(c=>c.value),updated:new Date().toLocaleString('zh-CN',{hour12:false})};if(id)games=games.map(x=>x.id===id?g:x);else games.unshift(g);persist();render();closeForm()});function val(id){return document.getElementById(id).value.trim()}
function removeGame(id){if(confirm('确定删除这条游戏记录吗？')){games=games.filter(g=>g.id!==id);persist();render()}}
function toggleState(id){games=games.map(g=>g.id===id?{...g,state:g.state==='草稿'?'已发布':'草稿',updated:new Date().toLocaleString('zh-CN',{hour12:false})}:g);persist();render()}
function resetFilters(){['search','category','platform','status'].forEach(id=>document.getElementById(id).value='');render()}
document.getElementById('globalSearch').addEventListener('input',render);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')render()});document.getElementById('all').addEventListener('change',e=>document.querySelectorAll('.pick').forEach(c=>c.checked=e.target.checked));render();
</script></body></html>
