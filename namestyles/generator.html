<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Name Generator</title><style>body{margin:0;background:#0b1020;color:#f4f7ff;font:16px/1.6 system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}a{color:#c5f467}input{padding:14px;background:#141c31;border:1px solid #34415e;border-radius:10px;color:white;font:inherit}button{padding:12px;border:0;border-radius:10px;background:#c5f467;font-weight:800;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.item{background:#141c31;border:1px solid #293650;padding:15px;border-radius:12px;overflow-wrap:anywhere}.item button{float:right}</style></head><body><main class="wrap"><a href="index.html">← Site home</a><h1>Stylish Name Generator</h1><p>Enter a name to create copy-ready Unicode styles.</p><div class="row"><input id="n" value="Shadow" aria-label="Your name"><button onclick="make()">Generate</button></div><div id="out" class="grid"></div><script>const styles=[s=>'꧁༒☬'+s+'☬༒꧂',s=>'亗 '+s.toUpperCase()+' 亗',s=>'★彡'+s+'彡★',s=>'『'+s+'』',s=>'ツ '+s+' ツ',s=>'𓆩♡𓆪 '+s+' 𓆩♡𓆪',s=>'♛ '+s+' ♛',s=>'✧･ﾟ: '+s+' :･ﾟ✧',s=>'『𝕹』 '+s,s=>'么 '+s+' 么'];function make(){let n=document.querySelector('#n').value||'Name';document.querySelector('#out').innerHTML=styles.map(f=>{let v=f(n);return '<div class="item">'+v+' <button data-v="'+encodeURIComponent(v)+'" onclick="navigator.clipboard.writeText(decodeURIComponent(this.dataset.v));this.textContent=\'Copied\'">Copy</button></div>'}).join('')}make()</script></main></body></html>
